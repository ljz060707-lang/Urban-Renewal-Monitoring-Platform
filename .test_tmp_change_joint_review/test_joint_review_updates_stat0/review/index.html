<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width'><title>双教师联合审核</title><style>body{font:14px system-ui;background:#0d1117;color:#e6edf3;margin:24px}header{position:sticky;top:0;background:#0d1117;padding:12px}article{border:1px solid #30363d;background:#161b22;border-radius:10px;padding:16px;margin:12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}span{color:#9db0c3}select,textarea,button{background:#0d1117;color:#eee;border:1px solid #465467;padding:8px;margin:5px}textarea{width:50%}</style><header><h1>双教师联合审核</h1><select id='priority'><option value=''>全部优先级</option><option>high</option><option>medium</option><option>low</option></select><button id='exportCsv'>导出 joint_review_decisions.csv</button></header><main id='list'></main><script>const DATA=[{"fusion_id": "a", "track_id": "", "building_teacher_state": "", "change_teacher_state": "", "new_probability_mean": "", "demolition_probability_mean": "", "any_change_probability_mean": "", "uncertainty_mean": "", "teacher_agreement": "", "fusion_confidence": "", "review_priority": "high", "fusion_issues": "", "lineage_event": "", "geometry_wkt": "POLYGON ((1 0, 1 1, 0 1, 0 0, 1 0))"}, {"fusion_id": "b", "track_id": "", "building_teacher_state": "", "change_teacher_state": "", "new_probability_mean": "", "demolition_probability_mean": "", "any_change_probability_mean": "", "uncertainty_mean": "", "teacher_agreement": "", "fusion_confidence": "", "review_priority": "low", "fusion_issues": "", "lineage_event": "", "geometry_wkt": "POLYGON ((3 2, 3 3, 2 3, 2 2, 3 2))"}],runKey='joint-review:fused:',priorityEl=document.querySelector('#priority'),listEl=document.querySelector('#list');function state(x){return JSON.parse(localStorage.getItem(runKey+x.fusion_id)||'{}')}function save(x,node){localStorage.setItem(runKey+x.fusion_id,JSON.stringify({fusion_id:x.fusion_id,final_state:node.querySelector('.final').value,teacher_decision:node.querySelector('.teacher').value,notes:node.querySelector('textarea').value,review_time:new Date().toISOString()}))}function render(){const rows=DATA.filter(x=>!priorityEl.value||x.review_priority===priorityEl.value);listEl.replaceChildren(...rows.map(x=>{const s=state(x),n=document.createElement('article');n.innerHTML=`<h2>${x.fusion_id}</h2><div class='metrics'><div>建筑教师<br><span>${x.building_teacher_state}</span></div><div>变化教师<br><span>${x.change_teacher_state}</span></div><div>new<br><span>${x.new_probability_mean}</span></div><div>demolition<br><span>${x.demolition_probability_mean}</span></div><div>any-change<br><span>${x.any_change_probability_mean}</span></div><div>uncertainty<br><span>${x.uncertainty_mean}</span></div><div>agreement<br><span>${x.teacher_agreement}</span></div><div>priority<br><span>${x.review_priority}</span></div></div><p>${x.fusion_issues||''}</p><select class='final'><option value=''>未审核</option><option>stable</option><option>new_building</option><option>demolished</option><option>construction_candidate</option><option>uncertain</option><option>rejected</option></select><select class='teacher'><option value=''>教师判断</option><option>building_teacher_correct</option><option>change_teacher_correct</option><option>both_correct</option><option>both_wrong</option><option>registration_issue</option><option>needs_geometry_edit</option><option>needs_change_mask_edit</option></select><textarea placeholder='备注'>${s.notes||''}</textarea><button>保存</button>`;n.querySelector('.final').value=s.final_state||'';n.querySelector('.teacher').value=s.teacher_decision||'';n.querySelector('button').onclick=()=>save(x,n);return n}))}priorityEl.onchange=render;document.querySelector('#exportCsv').onclick=()=>{const rows=DATA.map(state).filter(x=>x.final_state),cols=['fusion_id','final_state','teacher_decision','notes','review_time'],q=v=>'"'+String(v||'').replaceAll('"','""')+'"',csv='﻿'+cols.join(',')+'
'+rows.map(r=>cols.map(c=>q(r[c])).join(',')).join('
'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='joint_review_decisions.csv';a.click()};render()</script></html>
