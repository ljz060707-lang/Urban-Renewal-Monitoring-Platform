schema_version: "0.5.0"
output_root: outputs/pretraining/change_s2looking
datasets:
  s2looking: {enabled: true, root: "D:/Data Set/S2Looking"}
  second: {enabled: false}
  dsifn: {enabled: false}
model: {architecture: multitask_siamese_unet, encoder: resnet34, pretrained: false, semantic_classes: 2}
training:
  initialization_checkpoint: "outputs/pretraining/change_s2looking/20260721_232528/checkpoints/best_directional_change.pth"
  epochs: 1
  learning_rate: 0.00001
  batch_size: 8
  num_workers: 4
  prefetch_factor: 2
  patch_size: 256
  amp: true
  freeze_encoder: true
  demolition_head_only: true
  frozen_output_tolerance: 0.000001
  early_stopping_patience: 5
  save_every_epochs: 1
  keep_epoch_checkpoints: 3
  resume: false
  seed: 42
  dataset_sampling: {s2looking: 1.0}
  finetune_state: demolition_head_finetune
  smoke_training_only: true
  cache_mode: none
  cache_max_gb: 4
sampling:
  ordinary_sample_weight: 1.0
  demolition_only_weight: 2.0
  both_weight: 1.25
  max_hard_sample_fraction: 0.10
  direction_balanced: true
  max_both_fraction_within_hard: 0.40
loss:
  focal_gamma: 2.0
  stage_weights:
    directional: {binary: 0.0, new_building: 0.0, demolition: 1.0, semantic: 0.0}
model_selection:
  source_thresholds: {binary: 0.50, new: 0.60, demolition: 0.30}
patch_sampling:
  enabled: true
  strategy: demolition_composition
  composition:
    ordinary: 0.50
    demolition_positive: 0.25
    demolition_hard: 0.15
    difficult_negative: 0.10
  target_coverage_probability: 0.70
  boundary_probability: 0.20
  random_probability: 0.10
  jitter_px: 64
validation_monitor:
  size: 150
  seed: 42
  full_every_epoch: false
regression_abort:
  enabled: true
  pr_auc_tolerance: 0.002
