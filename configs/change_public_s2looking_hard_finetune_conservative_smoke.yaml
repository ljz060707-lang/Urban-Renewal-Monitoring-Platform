schema_version: "0.5.0"
output_root: outputs/pretraining/change_s2looking
datasets:
  s2looking: {enabled: true, root: "D:/Data Set/S2Looking"}
  second: {enabled: false}
  dsifn: {enabled: false}
model: {architecture: multitask_siamese_unet, encoder: resnet34, pretrained: false, semantic_classes: 2}
training:
  initialization_checkpoint: "outputs/pretraining/change_s2looking/20260721_232528/checkpoints/best_directional_change.pth"
  epochs: 2
  learning_rate: 0.000002
  batch_size: auto
  num_workers: 0
  patch_size: 256
  amp: true
  freeze_encoder: true
  early_stopping_patience: 5
  save_every_epochs: 1
  keep_epoch_checkpoints: 3
  resume: false
  seed: 42
  dataset_sampling: {s2looking: 1.0}
  finetune_state: hard_example_finetune
sampling:
  positive_sample_weight: 1.0
  hard_false_negative_weight: 1.25
  ordinary_sample_weight: 1.0
  max_hard_sample_fraction: 0.10
  direction_balanced: true
  max_both_fraction_within_hard: 0.40
loss:
  focal_gamma: 2.0
  stage_weights:
    directional: {binary: 0.5, new_building: 1.0, demolition: 1.0, semantic: 0.0}
model_selection:
  source_thresholds: {binary: 0.50, new: 0.60, demolition: 0.30}
  new_f1_tolerance: 0.002
