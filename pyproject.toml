[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-renewal-phase1"
version = "0.5.0"
description = "Plug-and-train building instance and bi-temporal change teachers for urban renewal monitoring"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.5",
  "scipy>=1.10",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.21",
  "pycocotools>=2.0.7",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
  "tensorboard>=2.14",
]
review = [
  "gradio>=5.0",
]

[project.scripts]
urban-monitor = "urban_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not train_smoke'"
markers = [
  "train_smoke: real Torch CPU training and inference smoke tests",
  "gpu: real CUDA training smoke tests; never mocked",
]
